name: CI

# Verification only: proves the docs sync + Docusaurus build succeed. Actual
# deployment is handled separately by Vercel's own build/deploy pipeline.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Sync docs & build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out sendra-web
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Read Node version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pulls docs/ from sendra-lab/Sendra at the commit pinned in
      # scripts/sync-docs.ts and rewrites it into docs/cli/. A bad pinned
      # ref, a GitHub API/network failure, or a transform bug fails here,
      # on the PR, instead of surfacing later as a broken Vercel deploy.
      #
      # SENDRA_DOCS_TOKEN is optional: sendra-lab/Sendra is public, so the
      # sync works without it. It exists purely to avoid GitHub's stricter
      # unauthenticated API rate limit (60 req/hour per runner IP, shared
      # across concurrent CI jobs) — set it if syncs start failing with
      # HTTP 403 rate-limit errors. Create a fine-grained PAT with read-only
      # access to sendra-lab/Sendra and add it as a repo secret named
      # SENDRA_DOCS_TOKEN under Settings > Secrets and variables > Actions.
      - name: Sync docs from sendra
        run: pnpm sync-docs
        env:
          SENDRA_DOCS_TOKEN: ${{ secrets.SENDRA_DOCS_TOKEN }}

      # Docs content is synced into "current" on every run above regardless.
      # This only decides whether that content also gets snapshotted as a
      # new versioned_docs/version-X.Y.Z — worthwhile at a minor/major
      # boundary, wasted churn on a patch-only bump. See
      # scripts/check-docs-version.ts for the comparison logic.
      - name: Check whether docs need a new version
        id: docs-version
        run: pnpm check-docs-version
        env:
          SENDRA_DOCS_TOKEN: ${{ secrets.SENDRA_DOCS_TOKEN }}

      - name: Create versioned docs snapshot
        if: steps.docs-version.outputs.should_version == 'true'
        run: pnpm docusaurus docs:version ${{ steps.docs-version.outputs.version }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Build site
        run: pnpm build
